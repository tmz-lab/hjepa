defaults:
  - solver: cem
  - _self_

seed: 42
policy: ???

solver:
  n_steps: 10

world:
  env_name: swm/ReacherDMControl-v0
  num_envs: ${eval.num_eval}
  task: qpos_match

dataset:
  keys_to_cache: [action]

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5
  history_len: 2

eval:
  num_eval: 50
  num_eval_total: 500
  batch_offset: 0
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  video: false
  dataset_name: dmc/reacher_random
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    - method: set_target_qpos
      args:
        target_qpos:
          value: goal_qpos

output:
  filename: results.txt
